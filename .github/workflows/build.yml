name: Build and Release BHTwitter

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "16.5"
        required: true
        type: string
      target_version:
        description: "Target iOS Version"
        default: "15.0"
        required: true
        type: string
      decrypted_ipa_url:
        description: "Direct URL of the decrypted X ipa"
        default: ""
        required: true
        type: string
      deploy_format:
        description: "Deployment format"
        default: sideloaded
        required: true
        type: choice
        options:
          - rootfull
          - sideloaded
          - trollstore
          - rootless
      commit_id:
        description: "(Optional) Commit ID to build at"
        default: ""
        required: false
        type: string
      upload_artifact:
        description: "Upload iPA as artifact (Public)"
        default: false
        required: false
        type: boolean
      create_release:
        description: "Create a draft release (Private)"
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BHTwitter
    runs-on: macos-14
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v5
        with:
          path: main
          ref: ${{ github.event.inputs.commit_id || github.ref }}
          submodules: recursive

      - name: Install Dependencies
        run: brew install make dpkg ldid

      - name: Add GNU Make to PATH
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Download Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Install cyan
        if: inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore'
        run: pip install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: iOS SDK Caching
        id: SDK
        uses: actions/cache@v5
        env:
          cache-name: iOS-${{ inputs.sdk_version }}-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout
          mv ./*.sdk "${THEOS}/sdks"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Get BHTwitter Version
        run: |
          BHTWITTER_VERSION=$(awk '/Version:/ {print $2}' main/control)
          echo "BHTWITTER_VERSION=${BHTWITTER_VERSION}" >> "$GITHUB_ENV"
          echo "$BHTWITTER_VERSION"

      - name: Prepare X iPA
        if: inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore'
        run: |
          wget "$IPA_URL" --no-verbose -O main/packages/com.atebits.Tweetie2.ipa
          unzip -q main/packages/com.atebits.Tweetie2.ipa -d main/tmp
          X_VERSION=$(grep -A 1 '<key>CFBundleShortVersionString</key>' main/tmp/Payload/Twitter.app/Info.plist |
            grep '<string>' | awk -F'[><]' '{print $3}')
          echo "X_VERSION=${X_VERSION}" >> "$GITHUB_ENV"
          echo "$X_VERSION"
        env:
          IPA_URL: ${{ inputs.decrypted_ipa_url }}

      - name: Build Package
        run: |
          cd ${{ github.workspace }}/main
          sed -i '' "s/^TARGET.*$/TARGET := iphone:clang:${{ inputs.sdk_version }}:${{ inputs.target_version }}/" Makefile
          ./build.sh --${{ inputs.deploy_format }}
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Verify Open in X Extension
        if: inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore'
        run: |
          cd ${{ github.workspace }}/main

          if [ "${{ inputs.deploy_format }}" = "sideloaded" ]; then
            ARTIFACT="$(find packages -maxdepth 1 -type f -name 'BHTwitter-sideloaded*.ipa' -print -quit)"
          else
            ARTIFACT="$(find packages -maxdepth 1 -type f -name 'BHTwitter-trollstore*.tipa' -print -quit)"
          fi

          if [ -z "$ARTIFACT" ]; then
            echo "The expected BHTwitter build artifact was not created."
            exit 1
          fi

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          unzip -q "$ARTIFACT" -d "$VERIFY_DIR"

          APP_DIR="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          APPEX_DIR="$APP_DIR/PlugIns/OpenInX.appex"

          if [ -z "$APP_DIR" ] || [ ! -d "$APPEX_DIR" ]; then
            echo "OpenInX.appex is missing from the built app."
            exit 1
          fi

          test -f "$APPEX_DIR/OpenInX"
          test -f "$APPEX_DIR/Info.plist"
          test -f "$APPEX_DIR/manifest.json"
          test -f "$APPEX_DIR/background.js"
          test -f "$APPEX_DIR/content.js"

          APPEX_COUNT="$(find "$APP_DIR/PlugIns" -mindepth 1 -maxdepth 1 -type d -name '*.appex' | wc -l | tr -d ' ')"
          if [ "$APPEX_COUNT" -ne 1 ]; then
            echo "Expected exactly one app extension, found $APPEX_COUNT."
            exit 1
          fi

          python3 - "$APP_DIR/Info.plist" "$APPEX_DIR/Info.plist" "$APPEX_DIR/manifest.json" <<'PY'
          import json
          import plistlib
          import sys

          main_plist_path, extension_plist_path, manifest_path = sys.argv[1:]

          with open(main_plist_path, "rb") as plist_file:
              main_plist = plistlib.load(plist_file)

          schemes = {
              scheme
              for url_type in main_plist.get("CFBundleURLTypes", [])
              for scheme in url_type.get("CFBundleURLSchemes", [])
          }
          if "bhtwitter" not in schemes:
              raise SystemExit("The bhtwitter URL scheme is missing from the app Info.plist.")

          with open(extension_plist_path, "rb") as plist_file:
              extension_plist = plistlib.load(plist_file)

          extension_point = extension_plist.get("NSExtension", {}).get("NSExtensionPointIdentifier")
          if extension_point != "com.apple.Safari.web-extension":
              raise SystemExit("OpenInX.appex is not registered as a Safari Web Extension.")

          with open(manifest_path, encoding="utf-8") as manifest_file:
              manifest = json.load(manifest_file)

          matches = {
              match
              for content_script in manifest.get("content_scripts", [])
              for match in content_script.get("matches", [])
          }
          required_matches = {"*://x.com/*", "*://twitter.com/*"}
          if not required_matches.issubset(matches):
              raise SystemExit("The Open in X manifest is missing required website matches.")

          print("Verified OpenInX.appex, its Safari manifest, and the bhtwitter URL scheme.")
          PY

      - name: Rename IPA to include IPA version
        if: inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore'
        run: |
          mv "main/packages/$(ls -t main/packages | head -n1)" \
             "main/packages/BHTwitter-${{ inputs.deploy_format }}_${{ env.BHTWITTER_VERSION }}_${{ env.X_VERSION }}.${IPA_EXT}"
        env:
          IPA_EXT: ${{ inputs.deploy_format == 'trollstore' && 'tipa' || 'ipa' }}

      - name: Pass package name
        id: package_name
        run: |
          echo "package=$(ls -t main/packages | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v5
        with:
          name: BHTwitter_${{ env.BHTWITTER_VERSION }}
          path: ${{ github.workspace }}/main/packages/${{ steps.package_name.outputs.package }}
          if-no-files-found: error

      - name: Create Draft Release
        if: ${{ inputs.create_release }}
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.BHTWITTER_VERSION }}
          name: v${{ env.BHTWITTER_VERSION }} - BHTwitter
          files: main/packages/${{ steps.package_name.outputs.package }}
          draft: true
